name: CI/CD RefCard02

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/refcard02:latest

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME .

      - name: Run container
        run: docker run -d --name refcard02 -p 8080:80 $IMAGE_NAME

      - name: Test website
        run: |
          for i in $(seq 1 10); do
            if curl -s http://localhost:8080 | grep -q '<div id="root">'; then
              echo "Website is up"
              exit 0
            fi
            echo "Waiting for website... ($i/10)"
            sleep 3
          done
          echo "Website did not respond"
          docker logs refcard02
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f refcard02 || true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        run: docker push $IMAGE_NAME
